services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"

  postgre_db:
    image: postgres:15
    container_name: postgres-db
    ports:
      - "${POSTGRE_SQL_DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRE_SQL_DB_NAME}
      - POSTGRES_USER=${POSTGRE_SQL_DB_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRE_SQL_DB_PASSWORD}